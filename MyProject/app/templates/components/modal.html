<div style="
    position:fixed;
    top:0; left:0;
    width:100%; height:100%;
    background:rgba(0,0,0,0.5);
    display:flex;
    justify-content:center;
    align-items:center;
">
    <div style="
        background:white;
        padding:20px;
        border-radius:10px;
        width:300px;
        box-shadow:0 4px 10px rgba(0,0,0,0.2);
        text-align:center;
    ">
        <h3>{{ title }}</h3>
        <p>{{ message }}</p>

        <a href="{{ url }}" style="
            display:inline-block;
            margin-top:15px;
            padding:10px 20px;
            background:#4CAF50;
            color:white;
            border-radius:5px;
            text-decoration:none;
